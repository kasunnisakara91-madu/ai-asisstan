name: Build AI ASISSTANT Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 and JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36.1 platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Decode optional google-services.json secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          RAW_VAL="$(printf '%s' "${GOOGLE_SERVICES_JSON_BASE64:-}")"
          if [ -n "$RAW_VAL" ]; then
            TRIMMED="$(printf '%s' "$RAW_VAL" | sed -e 's/^[[:space:]]*//')"
            case "$TRIMMED" in
              \{*)
                printf '%s' "$RAW_VAL" > app/google-services.json
                echo "Wrote raw app/google-services.json from repository secret."
                ;;
              *)
                printf '%s' "$RAW_VAL" | tr -d '[:space:]' | base64 -d > app/google-services.json
                echo "Decoded app/google-services.json from repository secret."
                ;;
            esac
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret configured; building standalone BYOK APK."
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Locate Generated Debug APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AI-ASISSTANT-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v7
        with:
          name: AI-ASISSTANT-APK
          path: release-artifacts

      - name: Verify APK Asset
        id: verify_apk
        run: |
          APK_FILE=$(find release-artifacts -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK artifact downloaded for release!"
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "Release asset: $APK_FILE"

      - name: Publish GitHub Release on Version Tag
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ steps.verify_apk.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
